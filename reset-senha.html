<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PMOCsys — Redefinir Senha</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
*,*::before,*::after{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}

:root{
  --primary:#1e40af;
  --accent:#27a9e3;
  --slate:#0f172a;
  --muted:#64748b;
  --bg:#f0f4fb;
  --success:#10b981;
  --error:#ff4b4b;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;overflow-y:auto;position:relative;
}

/* Background Elements (Fundo idêntico ao Index) */
.bg-scene{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%,rgba(30,64,175,.1) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 85%,rgba(39,169,227,.12) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 60% 50%,rgba(255,255,255,.6) 0%,transparent 70%),
    linear-gradient(160deg,#e8f0fd 0%,#f0f4fb 40%,#e4f3fb 100%);
}
.bg-dots{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(30,64,175,.12) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%);
}
.bg-grain{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}

/* Floating Tags */
.float-tags{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.tag{
  position:absolute;pointer-events:auto;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px) saturate(1.6);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);
  border:1px solid rgba(255,255,255,.95);border-radius:999px;
  padding:7px 16px 7px 13px;
  font-size:.74rem;color:#3b4a6a;font-weight:500;
  white-space:nowrap;
  box-shadow:0 2px 12px rgba(30,64,175,.07),inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;align-items:center;gap:7px;
  cursor:grab;will-change:transform;touch-action:none;
}
.tag-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--accent))}

/* Card Glassmorphism */
.card{
  position:relative;z-index:10;
  width:100%;max-width:432px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(32px) saturate(2);
  -webkit-backdrop-filter:blur(32px) saturate(2);
  border:1px solid rgba(255,255,255,.95);border-radius:30px;
  padding:50px 44px 40px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 24px 60px rgba(15,23,42,.18),
    0 60px 120px rgba(30,64,175,.22);
  animation:cardUp .65s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardUp{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}

.card::before{
  content:'';position:absolute;top:0;left:40px;right:40px;height:3px;
  background:linear-gradient(90deg,var(--primary) 0%,var(--accent) 60%,#5dd4f8 100%);
  border-radius:0 0 8px 8px;
}

/* Header & Logo */
.card-head{text-align:center;margin-bottom:32px;animation:fadeUp .55s .1s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
.logo-mark{
  width:44px;height:44px;
  background:linear-gradient(145deg,var(--primary),var(--accent));
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(30,64,175,.38);
}
.logo-name{font-family:'Syne',sans-serif;font-size:1.45rem;font-weight:800;color:var(--slate);letter-spacing:-.04em}
.logo-name span{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:500;font-size:1.1rem}

.card-title{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--slate);letter-spacing:-.04em;margin-bottom:7px}
.card-sub{font-size:.875rem;color:var(--muted);font-weight:300;line-height:1.6}

/* Form Elements */
.field{margin-bottom:18px;text-align:left}
.field-label{display:block;font-size:.7rem;font-weight:600;color:#475569;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.field-wrap{position:relative}
.field-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:#94a3b8;pointer-events:none;display:flex;align-items:center;
}
.field-input{
  width:100%;padding:13px 14px 13px 44px;
  border:1.5px solid #dde6f0;border-radius:13px;
  font-family:'Inter',sans-serif;font-size:.88rem;color:var(--slate);
  background:rgba(255,255,255,.85);outline:none;transition:all .2s;
}
.field-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(30,64,175,.09)}

/* Strength Meter */
.meter-box{margin-top:8px;height:4px;background:#e2e8f0;border-radius:10px;overflow:hidden;position:relative}
.meter-fill{height:100%;width:0%;transition:all .4s cubic-bezier(.4,0,.2,1)}

.btn-submit{
  width:100%;padding:15px;border-radius:13px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);
  color:#fff;font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:all .2s;box-shadow:0 4px 16px rgba(30,64,175,.32);margin-top:10px;
}
.btn-submit:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 10px 28px rgba(30,64,175,.38)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}

/* Alerts */
.alert{
  display:none;align-items:center;gap:9px;padding:12px;border-radius:11px;
  font-size:.82rem;margin-bottom:20px;
}
.alert.error{background:rgba(255,75,75,.07);border:1px solid rgba(255,75,75,.2);color:var(--error)}
.alert.success{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);color:var(--success)}
.alert.show{display:flex;animation:alertIn .22s ease both}

@keyframes alertIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.card-foot{
  margin-top:24px;padding-top:18px;border-top:1px solid rgba(220,230,245,.7);
  display:flex;align-items:center;justify-content:space-between;
}
.foot-text{font-size:.7rem;color:#aab5c8}

.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:520px){
  .card{width:calc(100vw - 32px);padding:32px 20px 24px;}
  .float-tags{display:none}
}
</style>
</head>
<body>

<div class="bg-scene"></div>
<div class="bg-dots"></div>
<div class="bg-grain"></div>

<div class="float-tags">
  <span class="tag" style="top:10%; left:5%"><span class="tag-dot"></span>Segurança</span>
  <span class="tag" style="top:15%; right:8%"><span class="tag-dot"></span>Criptografia</span>
  <span class="tag" style="bottom:20%; left:10%"><span class="tag-dot"></span>Privacidade</span>
  <span class="tag" style="bottom:15%; right:5%"><span class="tag-dot"></span>PMOCsys</span>
</div>

<div class="card">
  <div class="card-head">
    <div class="logo-wrap">
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="logo-name">PMOC<span>sys</span></div>
    </div>
    <div class="card-title">Nova Senha</div>
    <div class="card-sub">Crie uma senha forte para proteger sua conta.</div>
  </div>

  <div id="form-area">
    <div class="alert error" id="alert-err">
      <span id="alert-msg"></span>
    </div>
    
    <div class="alert success" id="alert-ok">
      Senha redefinida com sucesso! Redirecionando...
    </div>

    <div class="field">
      <label class="field-label">Nova Senha</label>
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input class="field-input" type="password" id="inp-nova" placeholder="••••••••" oninput="checkStrength(this.value)"/>
      </div>
      <div class="meter-box"><div class="meter-fill" id="meter"></div></div>
    </div>

    <div class="field">
      <label class="field-label">Confirmar Senha</label>
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </span>
        <input class="field-input" type="password" id="inp-conf" placeholder="••••••••"/>
      </div>
    </div>

    <button class="btn-submit" id="btn-submit" onclick="doReset()">
      <span id="btn-label">Atualizar Senha</span>
      <span class="spinner" id="btn-spinner" style="display:none"></span>
    </button>
  </div>

  <div class="card-foot">
    <div class="foot-text">© 2025 PMOCsys</div>
    <div class="foot-text">Protocolo SSL Ativo</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/tags.js" defer></script>
<script src="/tilt.js" defer></script>

<script>
const SUPABASE_URL = 'https://bbogahvnfjshibmwjdma.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJib2dhaHZuZmpzaGlibXdqZG1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MTY2OTQsImV4cCI6MjA5MzM5MjY5NH0.wjGf7qfp1QO0McQ60tBFhc1G0dIMP_0KvAB-qgCKVxc';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function checkStrength(val) {
  const fill = document.getElementById('meter');
  let score = 0;
  if (val.length > 7) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const widths = ['25%', '50%', '75%', '100%'];
  const colors = ['#ff4b4b', '#ffa500', '#27a9e3', '#10b981'];
  
  fill.style.width = val.length ? widths[score - 1] : '0%';
  fill.style.background = val.length ? colors[score - 1] : '';
}

async function doReset() {
  const nova = document.getElementById('inp-nova').value;
  const conf = document.getElementById('inp-conf').value;
  const alertErr = document.getElementById('alert-err');

  alertErr.classList.remove('show');

  if (nova.length < 8) {
    showErr('A senha deve conter no mínimo 8 caracteres.');
    return;
  }
  if (nova !== conf) {
    showErr('As senhas não coincidem.');
    return;
  }

  setLoading(true);
  const { error } = await _supabase.auth.updateUser({ password: nova });

  if (error) {
    showErr('Erro ao redefinir. Solicite um novo link.');
    setLoading(false);
    return;
  }

  document.getElementById('alert-ok').classList.add('show');
  document.getElementById('btn-submit').style.display = 'none';
  setTimeout(() => { window.location.href = '/index'; }, 2500);
}

function showErr(msg) {
  document.getElementById('alert-msg').textContent = msg;
  document.getElementById('alert-err').classList.add('show');
}

function setLoading(on) {
  const btn = document.getElementById('btn-submit');
  btn.disabled = on;
  document.getElementById('btn-label').style.display = on ? 'none' : 'block';
  document.getElementById('btn-spinner').style.display = on ? 'block' : 'none';
}
</script>
</body>
</html>
